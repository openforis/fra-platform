merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    batch_size: 1
    queue_conditions:
      - "#approved-reviews-by>=1"
    merge_conditions:
      - "#approved-reviews-by>=1"
    merge_method: squash
    update_method: rebase

pull_request_rules:
  - name: Automatic branch update
    conditions:
      - -conflict # skip PRs with conflicts
      - -draft # filter-out GH draft PRs
      - head!=production
    actions:
      update: {}
  - name: Automatic merge using squash
    conditions:
      - "#approved-reviews-by>=1"
      - -conflict
      - -draft
      - head!=production
    actions:
      queue:
