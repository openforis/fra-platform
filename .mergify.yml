queue_rules:
  - name: default
    queue_conditions:
      - "#approved-reviews-by>=1"
      - check-success=tests-all
    merge_conditions:
      - "#approved-reviews-by>=1"
      - check-success=tests-all
    merge_method: merge
    update_method: rebase

pull_request_rules:
  - name: Automatic branch update
    conditions:
      - -conflict # skip PRs with conflicts
      - -draft # filter-out GH draft PRs
      - head!=production
    actions:
      update: {}
  - name: Delete head branch after merge
    conditions:
      - merged
    actions:
      delete_head_branch:
        force: true
  - name: Automatic merge using squash
    conditions:
      - "#approved-reviews-by>=1"
      - -conflict
      - -draft
      - head!=production
    actions:
      queue:
