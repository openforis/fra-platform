# Load balancer for running several local web instances, like staging runs several dynos.
# How to run it: see README.md, "Running a local production environment".

worker_processes 1;

events {
  worker_connections 4096;
}

http {
  # no per-request logging during stress runs
  access_log off;

  # One port per instance, starting at PORT from .env. Running more instances
  # requires adding their ports here and restarting nginx.
  upstream web {
    server 127.0.0.1:9001;
    server 127.0.0.1:9002;
    server 127.0.0.1:9003;
    server 127.0.0.1:9004;
    keepalive 64;
  }

  # socket.io needs every request of a session on the same instance, so sockets all connect
  # to one instance; its redis adapter forwards the events emitted by the other instances
  upstream web_socket {
    server 127.0.0.1:9001;
  }

  server {
    listen 127.0.0.1:9000;

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # never retry a request on another instance: failures must reach the client, not be hidden by the proxy
      proxy_next_upstream off;
      # measure the app, not the proxy: don't buffer responses to disk
      proxy_buffering off;
      # k6 gives up at 60s, so there is no point in nginx waiting longer
      proxy_read_timeout 60s;
      client_max_body_size 10m;
    }

    # socket.io with the websocket upgrade headers
    location /socket.io/ {
      proxy_pass http://web_socket;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }
  }
}
