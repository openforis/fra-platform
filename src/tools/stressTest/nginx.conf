# Load balancer for running the stress tests against several local web instances,
# How to run it: see README.md, "Running against multiple local instances".

worker_processes 1;

events {
  worker_connections 4096;
}

http {
  # no per-request logging during stress runs
  access_log off;

  # One port per instance, starting at PORT from .env. Running more instances
  # requires adding their ports here and restarting nginx.
  upstream stress_test_web {
    server 127.0.0.1:9001;
    server 127.0.0.1:9002;
    server 127.0.0.1:9003;
    server 127.0.0.1:9004;
    keepalive 64;
  }

  server {
    listen 127.0.0.1:8080;

    location / {
      proxy_pass http://stress_test_web;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # never retry a request on another instance: failures must reach the tests, not be hidden by the proxy
      proxy_next_upstream off;
      # measure the app, not the proxy: don't buffer responses to disk
      proxy_buffering off;
      # k6 gives up at 60s, so there is no point in nginx waiting longer
      proxy_read_timeout 60s;
      client_max_body_size 10m;
    }
  }
}
