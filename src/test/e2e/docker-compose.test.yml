services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: 'fra'
      POSTGRES_PASSWORD: 'fra'
      POSTGRES_DB: 'fra'
    restart: always
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
      - ./healthcheck.sh:/healthcheck.sh
    healthcheck:
      test: ['CMD-SHELL', '/healthcheck.sh']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis-queue:
    image: redis:7
    ports:
      - '6379:6379'

  redis-data:
    image: redis:7
    ports:
      - '6389:6379'

  mailhog:
    image: mailhog/mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

  web:
    build:
      context: ../../..
      dockerfile: src/test/e2e/Dockerfile.test
    depends_on:
      postgres:
        condition: service_healthy
      redis-queue:
        condition: service_started
      redis-data:
        condition: service_started
      mailhog:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://fra:fra@postgres:5432/fra
      - FRA_MAIL_HOST=mailhog
      - FRA_MAIL_PORT=1025
      - FRA_MAIL_ENABLED=true
      - NODE_ENV=test-e2e
      - REDIS_QUEUE_URL=redis://redis-queue:6379
      - REDIS_DATA_URL=redis://redis-data:6379
      - PORT=9001
      - WWWHISPER_DISABLE=true
      - FRA_GOOGLE_CLIENT_ID=google-client-id
      - FRA_GOOGLE_CLIENT_SECRET=goggle-client-secret
      - TOKEN_SECRET=1234567890
    ports:
      - '9001:9001'
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://localhost:9001']
      interval: 5s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ../../..
      dockerfile: src/test/e2e/Dockerfile.test
    command: ['node', 'dist/server/worker/tasks/verifyLinks.js']
    depends_on:
      postgres:
        condition: service_healthy
      redis-queue:
        condition: service_started
      redis-data:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://fra:fra@postgres:5432/fra
      - NODE_ENV=test-e2e
      - REDIS_QUEUE_URL=redis://redis-queue:6379
      - REDIS_DATA_URL=redis://redis-data:6379
      - DEBUG=true

  playwright:
    build:
      context: ../../..
      dockerfile: src/test/e2e/Dockerfile.playwright
    depends_on:
      web:
        condition: service_healthy
      postgres:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      - BASE_URL=http://web:9001
      - MAILHOG_URL=http://mailhog:8025
    ports:
      - '9323:9323'
    volumes:
      - './test-results:/app/src/test/e2e/test-results'

volumes:
  postgres_data:
    name: e2e_postgres_data
