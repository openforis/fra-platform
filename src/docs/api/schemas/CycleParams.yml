components:
  parameters:
    assessmentName:
      name: assessmentName
      in: query
      required: true
      description: The name of the assessment. For example, "fra" or "panEuropean".
      schema:
        type: string
        enum: ["fra", "panEuropean"]

    cycleName:
      name: cycleName
      in: query
      required: true
      description: The name of the cycle. For example, "2020".
      schema:
        type: string
        enum: ["2020", "2025", "latest"]

    countryIso:
      name: countryIso
      in: query
      required: true
      description: A country ISO code like "FIN".
      schema:
        type: string
        example: FIN
