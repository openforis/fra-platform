components:
  schemas:
    ODPDataSourceMethod:
      type: string
      enum:
        - fullCoverMaps
        - nationalForestInventory
        - other
        - registersQuestionnaires
        - sampleBasedRemoteSensingAssessment

    ODPNationalClass:
      type: object
      properties:
        area:
          type: number
          nullable: true
        definition:
          type: string
        forestNaturalPercent:
          type: number
          nullable: true
        forestPercent:
          type: number
          nullable: true
        forestPlantationIntroducedPercent:
          type: number
          nullable: true
        forestPlantationPercent:
          type: number
          nullable: true
        name:
          type: string
        otherPlantedForestPercent:
          type: number
          nullable: true
        otherWoodedLandPercent:
          type: number
          nullable: true
        uuid:
          type: string

    OriginalDataPointValues:
      type: object
      properties:
        forestArea:
          type: string
          nullable: true
        naturalForestArea:
          type: string
          nullable: true
        otherPlantedForestArea:
          type: string
          nullable: true
        otherWoodedLand:
          type: string
          nullable: true
        plantationForestArea:
          type: string
          nullable: true
        plantationForestIntroducedArea:
          type: string
          nullable: true
        plantedForest:
          type: string
          nullable: true
        primaryForest:
          type: string
          nullable: true
        primaryForestPercent:
          type: string
          nullable: true
        total:
          type: string
          nullable: true
        totalForestArea:
          type: string
          nullable: true

    OriginalDataPoint:
      type: object
      required:
        - countryIso
        - id
        - values
      properties:
        countryIso:
          type: string
        dataSourceAdditionalComments:
          type: string
        dataSourceMethods:
          type: array
          items:
            $ref: '#/components/schemas/ODPDataSourceMethod'
        dataSourceReferences:
          type: string
        description:
          type: string
        id:
          type: integer
        idLegacy:
          type: integer
          deprecated: true
          nullable: true
        nationalClasses:
          type: array
          items:
            $ref: '#/components/schemas/ODPNationalClass'
        values:
          $ref: '#/components/schemas/OriginalDataPointValues'
        year:
          type: integer
