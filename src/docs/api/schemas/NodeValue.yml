components:
  schemas:
    NodeValueValidation:
      type: object
      properties:
        valid:
          type: boolean
        messages:
          type: array
          items:
            $ref: '#/components/schemas/NodeValueValidationMessage'

    NodeValueValidationMessage:
      type: object
      properties:
        key:
          type: string
        params:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: array
                items:
                  oneOf:
                    - type: string
                    - type: number

    NodeValue:
      type: object
      properties:
        calculated:
          type: boolean
        estimationUuid:
          type: string
        faoEstimate:
          type: boolean
        imported:
          type: boolean
        odpId:
          type: integer
        raw:
          type: object
        taxonCode:
          type: string
        estimated:
          type: boolean
          deprecated: true
        odp:
          type: boolean
          deprecated: true
        validation:
          $ref: '#/components/schemas/NodeValueValidation'
