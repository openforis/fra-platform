name: Run Tests

on:
  push:
    branches-ignore:
      - 'master'
      - 'production'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Build and start containers
        run: docker compose -f src/test/e2e/docker-compose.test.yml up -d
        env:
          NPM_GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Wait for services to be ready
        run: |
          timeout 300 bash -c 'until docker compose -f src/test/e2e/docker-compose.test.yml ps web | grep -q "healthy"; do sleep 5; done'

      - name: Run unit and integration tests
        run: docker compose -f src/test/e2e/docker-compose.test.yml exec -T web yarn test
        env:
          NPM_GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Run E2E tests
        run: docker compose -f src/test/e2e/docker-compose.test.yml run playwright npm run test:e2e
        env:
          NPM_GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Copy test results
        if: always()
        run: |
          mkdir -p playwright-report
          docker cp $(docker compose -f src/test/e2e/docker-compose.test.yml ps -q playwright):/app/src/test/e2e/test-results/. playwright-report/

      - uses: actions/upload-artifact@v4
        if: always() && !env.ACT
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Stop containers
        if: always()
        run: docker compose -f src/test/e2e/docker-compose.test.yml down -v
