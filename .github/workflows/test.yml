name: Run Unit and Integration Tests

on:
  pull_request:
    branches-ignore:
      - 'master'
      - 'production'

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      run_tests: true
    secrets: inherit

  unit-tests:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Run unit tests
        run: docker compose -f src/test/e2e/docker-compose.test.yml exec -T web yarn test:unit
        env:
          NPM_GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

  integration-tests:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Run integration tests
        run: docker compose -f src/test/e2e/docker-compose.test.yml exec -T web yarn test:integration
        env:
          NPM_GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

  cleanup:
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Stop containers
        run: docker compose -f src/test/e2e/docker-compose.test.yml down -v
