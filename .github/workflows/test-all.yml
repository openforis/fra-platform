name: Run test all (unit, integration and e2e)

on:
  pull_request:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  tests-all:
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: "Fixtures: Decrypt and extract"
        run: |
          echo "$BACKUP_PASSPHRASE" | gpg --batch --passphrase-fd 0 -d src/tools/db/fixtures.tar.gz.gpg | tar -xz -C src/tools/db
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

      - name: "DOCKER: Build containers"
        run: docker compose -f src/test/e2e/docker-compose.test.yml build

      - name: "DOCKER: Start database and services"
        run: docker compose -f src/test/e2e/docker-compose.test.yml up -d postgres redis-queue redis-data mailhog

      - name: "POSTGRES: Wait ready"
        run: |
          timeout 60 bash -c 'until docker compose -f src/test/e2e/docker-compose.test.yml ps postgres | grep -q "healthy"; do sleep 2; done'

      - name: "WEB: Init schemas"
        run: |
          docker compose -f src/test/e2e/docker-compose.test.yml run --rm --no-deps web \
            yarn ts-node src/tools/db/initSchemas.ts

      - name: "WEB: Import fixture data"
        run: |
          docker compose -f src/test/e2e/docker-compose.test.yml run --rm --no-deps web \
            yarn ts-node src/tools/db/import.ts

      - name: "WEB: Generate cache"
        run: |
          docker compose -f src/test/e2e/docker-compose.test.yml run --rm --no-deps web \
            yarn ts-node src/tools/generateCache/index.ts

      - name: "WEB: Start server"
        run: docker compose -f src/test/e2e/docker-compose.test.yml up -d web

      - name: "WEB: Wait ready"
        run: |
          timeout 60 bash -c 'until docker compose -f src/test/e2e/docker-compose.test.yml ps web | grep -q "healthy"; do sleep 2; done'

      - name: "Playwright: Create test results directory"
        run: mkdir -p playwright-report

      - name: "WEB: Run unit and integration tests"
        run: docker compose -f src/test/e2e/docker-compose.test.yml exec -T -e NODE_ENV=test web yarn test

      - name: "Playwright: Run E2E tests"
        if: always()
        run: |
          docker compose -f src/test/e2e/docker-compose.test.yml run --no-deps \
            playwright npm run test:e2e

      - name: "Playwright: Zip test results"
        if: always()
        run: |
          cd src/test/e2e
          zip -r ../../../playwright-results.zip test-results/

      - name: "Playwright: Upload test results"
        if: always() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: playwright-results.zip
          retention-days: 30

      - name: "Docker: Stop containers"
        if: always()
        run: docker compose -f src/test/e2e/docker-compose.test.yml down -v
